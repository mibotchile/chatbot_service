<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PrestaUnion · Ada</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --vox-bg:#09090b; --vox-surface:#111113; --vox-surface-2:#18181b; --vox-border:#27272a;
      --vox-text:#fafafa; --vox-text-muted:#a1a1aa; --vox-text-subtle:#71717a;
      --vox-brand:#f5c518; --vox-brand-hover:#e0b315; --vox-brand-soft:#3a2e08; --vox-success:#22c55e;
    }
    * { font-family:'Inter',system-ui,sans-serif; box-sizing:border-box; }
    html,body { margin:0; padding:0; background:var(--vox-bg); color:var(--vox-text); height:100%; }
    body { display:flex; flex-direction:column; min-height:100vh;
      background-image: radial-gradient(circle at top right, rgba(245,197,24,0.05), transparent 45%); }

    .chat-header { position:sticky; top:0; z-index:30; background:rgba(9,9,11,0.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--vox-border); }
    .chat-header-inner { max-width:820px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand-block { display:flex; align-items:center; gap:12px; }
    .avatar-hex { width:38px; height:38px; border-radius:11px; background:var(--vox-brand-soft); border:1px solid rgba(245,197,24,0.35);
      display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--vox-brand); font-size:16px; }
    .chat-header .name { font-weight:700; font-size:15px; }
    .chat-header .name .accent { color:var(--vox-brand); }
    .chat-header .sub { font-size:12px; color:var(--vox-text-subtle); display:flex; align-items:center; gap:6px; }
    .chat-header .sub .dot { width:6px; height:6px; border-radius:50%; background:var(--vox-success); }
    .chat-header .actions { display:flex; gap:8px; }
    .chat-header .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:9999px;
      background:var(--vox-surface); border:1px solid var(--vox-border); color:var(--vox-text-muted); font-size:12px; font-weight:500; cursor:pointer; transition:all .2s; text-decoration:none; }
    .chat-header .btn:hover { border-color:var(--vox-brand); color:var(--vox-brand); }
    .chat-header .btn svg { width:14px; height:14px; }

    .ident-bar { max-width:820px; margin:14px auto 0; padding:0 24px; }
    .ident-card { background:var(--vox-surface); border:1px solid var(--vox-border); border-radius:14px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .ident-card.cold { border-color:rgba(239,68,68,0.35); }
    .ident-left { display:flex; flex-direction:column; gap:2px; }
    .ident-left .who { font-weight:700; font-size:14px; }
    .ident-left .biz { font-size:12px; color:var(--vox-text-muted); }
    .ident-badge { font-size:11px; font-weight:600; padding:5px 11px; border-radius:9999px; }
    .ident-badge.aldia { background:rgba(34,197,94,0.12); color:#4ade80; }
    .ident-badge.mora { background:rgba(239,68,68,0.12); color:#f87171; }
    .ident-badge.libre { background:var(--vox-brand-soft); color:var(--vox-brand); }
    .ident-badge.cold { background:rgba(239,68,68,0.12); color:#f87171; }

    .messages-wrap { flex:1; overflow-y:auto; padding:20px 0 150px; }
    .messages { max-width:820px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:26px; }

    .welcome { text-align:center; padding:38px 0 14px; animation:fade-in .5s ease-out; }
    .welcome .ava { width:64px; height:64px; border-radius:18px; background:var(--vox-brand-soft); border:1px solid rgba(245,197,24,0.35);
      display:inline-flex; align-items:center; justify-content:center; font-weight:800; color:var(--vox-brand); font-size:26px; margin-bottom:14px; }
    .welcome h1 { font-size:24px; font-weight:800; letter-spacing:-0.02em; margin:0 0 8px; }
    .welcome h1 .accent { color:var(--vox-brand); }
    .welcome p { color:var(--vox-text-muted); font-size:15px; max-width:460px; margin:0 auto; line-height:1.55; }

    .msg.user { display:flex; justify-content:flex-end; animation:slide-up .3s ease-out; }
    .msg.user .bubble { background:var(--vox-brand); color:var(--vox-bg); padding:11px 16px; border-radius:18px 18px 4px 18px; max-width:78%; font-size:14.5px; line-height:1.45; font-weight:500; }

    .msg.agent { display:flex; gap:12px; animation:slide-up .3s ease-out; }
    .msg.agent .ava { width:34px; height:34px; border-radius:10px; background:var(--vox-brand-soft); border:1px solid rgba(245,197,24,0.3);
      display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--vox-brand); font-size:13px; flex-shrink:0; }
    .msg.agent .body { flex:1; min-width:0; }
    .msg.agent .reply { font-size:14.5px; line-height:1.6; color:var(--vox-text); white-space:pre-wrap; }
    .msg.agent .reply a { color:var(--vox-brand); font-weight:600; }
    .msg.agent .reply strong { color:var(--vox-brand); }
    .msg.agent .typing { display:inline-flex; align-items:center; gap:4px; padding:9px 14px; background:var(--vox-surface-2); border:1px solid var(--vox-border); border-radius:14px; }
    .msg.agent .typing span { width:6px; height:6px; border-radius:50%; background:var(--vox-text-subtle); animation:typing 1.4s infinite ease-in-out; }
    .msg.agent .typing span:nth-child(2){animation-delay:.2s;} .msg.agent .typing span:nth-child(3){animation-delay:.4s;}

    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .chips button { background:var(--vox-surface); border:1px solid var(--vox-border); color:var(--vox-text-muted); font-size:13px; font-weight:500;
      padding:8px 14px; border-radius:9999px; cursor:pointer; transition:all .2s; }
    .chips button:hover { border-color:var(--vox-brand); color:var(--vox-brand); }

    .input-bar { position:fixed; bottom:0; left:0; right:0; z-index:25;
      background:linear-gradient(180deg, transparent 0%, rgba(9,9,11,0.85) 25%, var(--vox-bg) 60%); padding:22px 16px 18px; }
    .input-inner { max-width:820px; margin:0 auto; }
    .input-form { display:flex; gap:8px; align-items:flex-end; background:var(--vox-surface); border:1px solid var(--vox-border);
      border-radius:18px; padding:8px 10px 8px 18px; box-shadow:0 8px 30px -10px rgba(0,0,0,0.5); transition:border-color .2s, box-shadow .2s; }
    .input-form:focus-within { border-color:var(--vox-brand); box-shadow:0 0 0 3px rgba(245,197,24,0.12); }
    .input-form textarea { flex:1; background:transparent; border:0; outline:0; resize:none; color:var(--vox-text); font-size:15px; line-height:1.5; font-family:inherit; padding:8px 0; max-height:140px; min-height:24px; }
    .input-form textarea::placeholder { color:var(--vox-text-subtle); }
    .input-form .send-btn { width:36px; height:36px; border-radius:50%; background:var(--vox-brand); border:0; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s; color:var(--vox-bg); flex-shrink:0; }
    .input-form .send-btn:hover { transform:scale(1.05); background:var(--vox-brand-hover); }
    .input-form .send-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .input-form .send-btn svg { width:18px; height:18px; }
    .input-hint { text-align:center; font-size:11px; color:var(--vox-text-subtle); margin-top:8px; }

    *::-webkit-scrollbar { width:6px; } *::-webkit-scrollbar-track { background:transparent; }
    *::-webkit-scrollbar-thumb { background:var(--vox-border); border-radius:3px; }

    @keyframes fade-in { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
    @keyframes slide-up { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
    @keyframes typing { 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-4px);opacity:1;} }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <header class="chat-header">
    <div class="chat-header-inner">
      <div class="brand-block">
        <div class="avatar-hex">A</div>
        <div>
          <div class="name">Presta<span class="accent">Union</span> · Ada</div>
          <div class="sub"><span class="dot"></span> Asistente de cobranzas</div>
        </div>
      </div>
      <div class="actions">
        <a href="index.html" class="btn">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Volver
        </a>
      </div>
    </div>
  </header>

  <div class="ident-bar"><div id="ident-card"></div></div>

  <main class="messages-wrap" id="messages-wrap">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="ava">A</div>
        <h1>Hola, soy <span class="accent">Ada</span>.</h1>
        <p id="welcome-sub">Tu asistente de PrestaUnion. ¿En qué te ayudo hoy?</p>
        <div class="chips" id="welcome-chips" style="justify-content:center;"></div>
      </div>
    </div>
  </main>

  <div class="input-bar">
    <div class="input-inner">
      <form class="input-form" id="chat-form">
        <textarea id="chat-input" placeholder="Escribí tu consulta…" rows="1" autofocus></textarea>
        <button type="submit" class="send-btn" id="send-btn" aria-label="Enviar">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m0 0l-7-7m7 7l-7 7"/></svg>
        </button>
      </form>
      <p class="input-hint">Demo PrestaUnion · datos ficticios · Ada mantiene el contexto de la conversación.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
